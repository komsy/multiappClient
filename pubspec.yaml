name: multiapp
description: "Multiapp Order App."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'


#--------------- PACKAGES ------------------#
dependencies:
  flutter:
    sdk: flutter

  # Utility Packages
  intl: ^0.19.0
  lottie: ^2.7.0
  logger: ^2.4.0
  shimmer: ^3.0.0
  clipboard: ^0.1.3
  # image_picker: ^1.1.2
  url_launcher: ^6.3.0
  # flutter_dropzone: ^3.0.7
  # flutter_typeahead: ^5.2.0
  # connectivity_plus: ^5.0.1
  connectivity_plus: ^6.0.5
  # multi_select_flutter: ^4.1.3
  # cached_network_image: ^3.4.0
  flutter_native_splash: ^2.4.1
  smooth_page_indicator: ^1.2.0+3
  dropdown_search: ^5.0.6
  # dropdown_search: ^3.0.1
  
  # Web Specific
  # web: ^0.5.1
  http: ^1.2.2
  # html: ^0.15.4
  # fl_chart: ^0.66.2
  # data_table_2: ^2.5.9
  # url_strategy: ^0.2.0


  # Icons
  iconsax: ^0.0.8
  # cupertino_icons: ^1.0.8

  # State Management
  get: ^4.6.6
  get_storage: ^2.1.1

  # Product Specific
  # readmore: ^3.0.0
  # carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  # capped_progress_indicator: ^0.0.2


  # Firebase
  # firebase_core: ^3.2.0
  # firebase_storage: ^12.1.3
  # cloud_firestore: ^5.2.1
  # firebase_auth: ^5.1.4
  # google_sign_in: ^6.2.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  crypto: ^3.0.5
  dart_jsonwebtoken: ^2.14.1
  envied: ^0.5.4+1
  dio: ^5.7.0
  uuid: ^4.5.1


  #--------------- ./ PACKAGES END ------------------#

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  envied_generator: ^0.5.4+1
  flutter_launcher_icons: ^0.14.1


# ---------------- APP Icon ------------------#
flutter_launcher_icons:
  android: true
  image_path: "assets/logos/multiapp.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logos/multiapp_foreground.png"

flutter:
  uses-material-design: true

  #--------------- LOCAL ASSETS ------------------#
  assets:
    - assets/logos/
    - assets/images/content/
    - assets/images/products/
    - assets/images/animations/
    - assets/icons/payment_methods/
    - assets/images/on_boarding_images/
    - .env
  #--------------- LOCAL FONTS ------------------#
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800
